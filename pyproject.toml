[project]
name = "graduate"
version = "0.1.0"
description = "Find out which of your agent's calls a cheaper model can take over, with a statistical certificate per slice of traffic."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pydantic>=2.7"]

[project.scripts]
graduate = "graduate.cli:main"

[project.optional-dependencies]
parquet = ["pyarrow>=17"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[project.urls]
Homepage = "https://nstream-ai.github.io/graduate/"
Issues = "https://github.com/nstream-ai/graduate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graduate"]

[tool.hatch.build.targets.sdist]
include = ["src/graduate", "tests", "README.md", "LICENSE", "REFERENCES.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["graduate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["sim: statistical simulation tests (slow)"]
