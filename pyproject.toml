[project]
name = "graduate"
version = "0.2.2"
description = "Find out which of your agent's calls a cheaper model can take over, with a statistical certificate per slice of traffic."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Graduate Authors" }]
keywords = ["llm", "agents", "evaluation", "statistics", "certification", "model routing", "distillation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pydantic>=2.7"]

[project.scripts]
graduate = "graduate.cli:main"

[project.optional-dependencies]
parquet = ["pyarrow>=17"]
completions = ["transformers>=4.45"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[project.urls]
Homepage = "https://nstream-ai.github.io/graduate/"
Repository = "https://github.com/nstream-ai/graduate"
Issues = "https://github.com/nstream-ai/graduate/issues"
Changelog = "https://github.com/nstream-ai/graduate/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graduate"]

[tool.hatch.build.targets.sdist]
include = ["src/graduate", "tests", "README.md", "LICENSE", "NOTICE", "REFERENCES.md", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["graduate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["sim: statistical simulation tests (slow)"]
